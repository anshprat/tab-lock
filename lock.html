<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Locked — Tab Lock</title>
    <link rel="stylesheet" href="lock.css" />
  </head>
  <body>
    <main class="card">
      <div class="icon">🔒</div>
      <h1>This site is locked</h1>
      <p class="site" id="site-label">Loading…</p>
      <form id="unlock-form" autocomplete="off">
        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Unlock</button>
      </form>
      <p class="error" id="error"></p>
    </main>
    <script src="lock.js"></script>
  </body>
</html>
